name: Deploy Godot Android - Internal Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - godot-port
      - codex/minigame-hardening
      - codex/godot-performance-maintainability
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"
  GODOT_CHANNEL: stable
  EXPORT_PRESET: Android Alpha
  CI_ANDROID_COMPILE_SDK: "36"
  CI_ANDROID_BUILD_TOOLS_VERSION: "36.1.0"
  CI_ANDROID_NDK_VERSION: "29.0.14206865"

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    # A first-run asset import is documented at 30+ minutes; leave enough
    # headroom for its 45-minute guard and the bounded test manifest.
    timeout-minutes: 75

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Godot import cache
        uses: actions/cache@v4
        with:
          path: godot/.godot
          # Exact key only (no restore-keys): partial imports can leave class
          # metadata or generated resources unavailable to the parse gate.
          key: godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('godot/**/*.import', 'godot/project.godot') }}

      - name: Cache Godot tooling downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/unicorn-arcade/godot
          key: godot-tooling-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}

      - name: Run Godot test manifest
        run: |
          chmod +x scripts/ci/install-godot.sh scripts/ci/godot-tests.sh scripts/ci/test-android-template-cache.sh
          ./scripts/ci/godot-tests.sh

  build-and-deploy:
    needs: godot-tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Godot import cache
        uses: actions/cache@v4
        with:
          path: godot/.godot
          # Exact key only (no restore-keys): fuzzy restores caused skipped imports
          # with missing .ctex files. Warm hits skip the 30+ min cold reimport.
          key: godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('godot/**/*.import', 'godot/project.godot') }}

      - name: Cache Godot tooling downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/unicorn-arcade/godot
          key: godot-tooling-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}

      - name: Cache Android build template
        uses: actions/cache@v4
        with:
          path: godot/android/build
          # Exact key only: ensure_android_build_template also verifies the
          # extracted cache's .build_version before accepting any AARs.
          key: godot-android-build-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}-${{ hashFiles('godot/export_presets.cfg', 'godot/android/.build_version') }}

      - name: Cache Gradle (Android export)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('godot/android/build/**/*.gradle*', 'godot/export_presets.cfg') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Pinned legacy Android backend: Families-listed play-services-ads, no Next-Gen.
      - name: Cache AdMob Android binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/unicorn-arcade/admob
          key: admob-android-${{ env.GODOT_VERSION }}-v4.3.1-families-b2429ce2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            if [[ -x "$candidate" ]]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Installing Android cmdline-tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/android-cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -qo /tmp/android-cmdline-tools.zip -d /tmp/android-cmdline-tools
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/android-cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          # pipefail + `yes` → SIGPIPE (141) when sdkmanager exits; do not fail the step
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-${CI_ANDROID_COMPILE_SDK}" \
            "build-tools;${CI_ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${CI_ANDROID_NDK_VERSION}" \
            "cmake;3.10.2.4988404"

      - name: Install Godot export tooling
        run: |
          chmod +x scripts/ci/install-godot.sh scripts/ci/godot-export-android.sh
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/release.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/release.keystore" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep "Alias name:"

      - name: Export Godot Android (AAB + debug APK)
        env:
          # Same as main Capacitor CI: versionCode=run_number, versionName=1.<run_number>
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
          MIN_PLAY_VERSION_CODE: "183"
          ADMOB_ADS_ENABLED: "true"
          # Play AAB uses the production unit; the installable debug APK is
          # rewritten to Google's test unit before its separate export.
          ADMOB_RELEASE_BANNER_UNIT_ID: ca-app-pub-2846735043546429/2606475202
          ADMOB_DEBUG_BANNER_UNIT_ID: ca-app-pub-3940256099942544/6300978111
          RELEASE_PACKAGE_NAME: com.grapegames.wlarcade
          DEBUG_PACKAGE_NAME: com.guettler.unicornarcade
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./scripts/ci/godot-export-android.sh

      - name: Upload debug APK (install on phone)
        uses: actions/upload-artifact@v4
        with:
          name: UnicornArcade-debug-apk
          path: godot/build/android/UnicornArcade-debug.apk
          if-no-files-found: error

      - name: Upload Families SDK verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnicornArcade-ads-evidence
          path: godot/build/android/ads-evidence/
          if-no-files-found: warn

      - name: Keep only the last 3 debug APK artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'UnicornArcade-debug-apk';
            const keep = 3;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: artifactName,
                per_page: 100,
              }
            );
            const stale = artifacts
              .filter((artifact) => artifact.name === artifactName && !artifact.expired)
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at))
              .slice(keep);
            for (const artifact of stale) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted ${artifactName} #${artifact.id} from ${artifact.created_at}`);
            }
            core.info(`Kept the newest ${keep} ${artifactName} artifact(s); deleted ${stale.length}.`);

      - name: Upload to Play Store Internal track
        if: github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.grapegames.wlarcade
          releaseFiles: godot/build/android/UnicornArcade.aab
          tracks: internal
          status: completed
